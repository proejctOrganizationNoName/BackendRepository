name: projectBackEndTest

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: '7.x'
          auto-start: true
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Test with Gradle
        run: ./gradlew clean test --refresh-dependencies --no-daemon --stacktrace
